version: "3.9"

services:
  grafana-sync:
    build: ..
    container_name: grafana-sync
    restart: unless-stopped

    # Every setting lives in .env next to this file. Nothing is duplicated here,
    # and no secret is in a git-tracked file. See env.example for what each key
    # does - that file is the documentation and the template in one.
    #
    # docker compose uses .env twice, which is intentional: env_file hands the
    # whole file to the container as environment variables, and ${DOCKER_GID}
    # below is interpolated from the same file at compose level (compose always
    # auto-loads ".env" from the project directory for ${...} substitution).
    env_file:
      - .env

    ports:
      - "8080:8080"

    # The container runs as a non-root user, so reading the bind-mounted docker
    # socket requires the gid that owns it on this host. deploy.sh detects it
    # and writes DOCKER_GID into .env; 999 is only a fallback and is wrong on
    # plenty of distributions.
    group_add:
      - "${DOCKER_GID:-999}"

    volumes:
      - grafana-sync-data:/data
      # Read-only access to the daemon for /api/logs/docker, which is how the
      # grafana container log becomes visible from here.
      #
      # Be aware what this grants: `:ro` stops the socket file being replaced,
      # it does NOT make the daemon read-only. Anything that can reach this
      # socket can control docker on the host, which is equivalent to root. The
      # only thing standing between the network and it is API_TOKEN. Drop this
      # mount (and group_add above) if that trade is not acceptable -
      # /api/logs/app keeps working and /api/logs/docker then returns a clear
      # "socket not mounted" error.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - grafana_app-network

volumes:
  grafana-sync-data:

networks:
  grafana_app-network:
    external: true
