version: "3.9"

services:
  grafana-sync:
    build: ..
    container_name: grafana-sync
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: "/data"
      # Tick interval for the auto-sync loop. "0" means the loop goroutine is
      # never started at all, so nothing can sync unattended — not even if the
      # "Automatische Updates" toggle in the UI is switched back on.
      #
      # Held at "0" deliberately until a manual plan has been validated:
      # unattended syncing every 15 minutes is what let a broken user lookup go
      # unnoticed for months. Restore "15m" afterwards.
      SYNC_INTERVAL: "0"
      # Forces the persisted auto-sync flag to this value on every container
      # start, overriding whatever the UI toggle has stored. Belt and braces
      # alongside SYNC_INTERVAL=0: this clears the flag, that removes the loop.
      #
      # Note the loop runs once immediately on start, before waiting for the
      # first tick — so a restart with the flag set syncs straight away.
      AUTO_SYNC_ON_START: "false"
      DEFAULT_USER_ROLE: "Viewer"
      ALLOW_CREATE_USERS: "true"
      # Kept off deliberately: removals are the only destructive action here, and
      # they ran unchecked while additions were silently failing. Turn back on
      # after verifying a plan.
      ALLOW_REMOVE_TEAM_MEMBERS: "false"
      # Talk to the grafana container directly inside the shared docker network.
      # The grafana container listens on https/443 (TLS terminated inside grafana
      # itself); its certificate is for grafana-prd.advanzia.com, so we must
      # skip TLS verification when using the container alias `grafana`.
      GRAFANA_URL: "https://grafana:443"
      GRAFANA_INSECURE_TLS: "true"
      # Verbose connection logging (DNS / TCP / TLS / TTFB per request,
      # /etc/hosts dump + reachability probe at startup). Set to "false" once
      # things are stable.
      GRAFANA_DEBUG: "true"
      # Credentials come from deploy/.env, which deploy.sh installs from
      # /etc/grafana-ad-syncher.env after cloning. See deploy/env.example.
      #
      # A non-empty GRAFANA_ADMIN_TOKEN always wins and the password is never
      # sent. Creating and looking up users needs Grafana *server* admin, which a
      # service account token cannot hold — so leave the token empty and use a
      # local admin user if the syncer must create users.
      GRAFANA_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GRAFANA_ADMIN_TOKEN: "${GRAFANA_ADMIN_TOKEN}"
      ENTRA_TENANT_ID: "${ENTRA_TENANT_ID}"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID}"
      ENTRA_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET}"
    ports:
      - "8080:8080"
    volumes:
      - grafana-sync-data:/data
    networks:
      - grafana_app-network

volumes:
  grafana-sync-data:

networks:
  grafana_app-network:
    external: true
